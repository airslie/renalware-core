# i18n-tasks configuration for application translations.
#
# For an error-focused check, run:
#   bundle exec i18n-tasks missing
#   bundle exec i18n-tasks check-consistent-interpolations
#   bundle exec i18n-tasks check-reserved-interpolations
#
# `i18n-tasks health` additionally reports unused and unnormalised keys, so it is
# deliberately not the recommended routine check for this codebase.

base_locale: en
locales: [en]

data:
  read:
    - config/locales/**/*.yml
    - app/view_components/**/*.yml

  yaml:
    write:
      # Preserve long translation values instead of wrapping them.
      line_width: -1

# These translations are supplied by rails-i18n rather than this repository.
ignore_missing:
  - "date.formats.*"
  - "number.currency.format.*"
  - "time.*"

search:
  relative_paths:
    - app/controllers
    - app/helpers
    - app/mailers
    - app/presenters
    - app/queries
    - app/services
    - app/view_components
    - app/views

  paths:
    - app/controllers
    - app/helpers
    - app/mailers
    - app/presenters
    - app/queries
    - app/services
    - app/view_components
    - app/views

  relative_roots:
    - app/controllers
    - app/helpers
    - app/mailers
    - app/presenters
    - app/queries
    - app/services
    - app/view_components
    - app/views

  exclude:
    - app/assets/images
    - app/assets/fonts
    - app/assets/videos

  only:
    - "*.rb"
    - "*.html.slim"
    - "*.html.erb"

  # Account for dynamically constructed translation keys.
  strict: false
