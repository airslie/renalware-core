# https://edgeguides.rubyonrails.org/active_storage_overview.html
local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: eu-west-1
  bucket: <%= ENV["AWS_BUCKET"] %>

# We use Azure mapped paths in the App Service to map /uploads to a /storage folder
# in the FileStorage resource.
azure:
  service: Disk
  root: /uploads

azure_blob:
  service: AzureBlob
  storage_account_name: <%= ENV["AZURE_STORAGE_ACCOUNT_NAME"] %>
<% if ENV["AZURE_STORAGE_ACCESS_KEY"].present? %>
  storage_access_key: <%= ENV["AZURE_STORAGE_ACCESS_KEY"] %>
<% end %>
<% if ENV["AZURE_STORAGE_PRINCIPAL_ID"].present? %>
  principal_id: <%= ENV["AZURE_STORAGE_PRINCIPAL_ID"] %>
<% end %>
<% if ENV["AZURE_STORAGE_USE_MANAGED_IDENTITIES"].present? %>
  use_managed_identities: <%= ActiveModel::Type::Boolean.new.cast(ENV["AZURE_STORAGE_USE_MANAGED_IDENTITIES"]) %>
<% end %>
  container: <%= ENV["AZURE_STORAGE_CONTAINER"] %>
