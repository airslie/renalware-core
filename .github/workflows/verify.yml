name: Verify

# Do not run when a tag pushed
# Do not run if updating docs
on:
  push:
    branches:
      - main
    tags-ignore:
      - "*"
    paths-ignore:
      - "docs/**"
      - "doc/**"
      - "documentation/**"
      - "README.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [main]

# Cancel any running actions triggered on the same branch.
# NB: github.ref is the branch or tag that triggered the workflow run.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_GITHUB__COM: ${{ secrets.CR_PAT }}
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  RENALWARE_EXTENSIONS: ${{ secrets.RENALWARE_EXTENSIONS }}
  RAILS_ENV: test
  PGHOST: localhost

jobs:
  assets:
    name: Build Assets
    timeout-minutes: 10
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup node and yarn with caching
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"

      - name: Install js packages with yarn
        run: yarn install --frozen-lockfile

      - name: Asset cache
        uses: actions/cache@v6
        with:
          path: |
            public/assets
            tmp/cache/assets/sprockets
          key: asset-cache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            asset-cache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
            asset-cache-${{ runner.os }}-${{ github.ref }}-
            asset-cache-${{ runner.os }}-

      - name: Assets precompile
        run: bin/yarn build && bin/yarn build:css && bin/rails assets:precompile --trace

  linters:
    name: Linters
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup node and yarn with caching
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"

      - name: Install js packages with yarn
        run: yarn install --frozen-lockfile

      - name: Install PostgreSQL 18.4 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update

          client_version="$(
            apt-cache madison postgresql-client-18 |
              awk '$3 ~ /^18[.]4-/ { print $3; exit }'
          )"
          test -n "$client_version"
          sudo apt-get install -y "postgresql-client-18=$client_version"
          pg_dump --version | grep -F "18.4"

      - name: Setup test database
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          RAILS_ENV: test
          PGHOST: localhost
        run: bin/rails db:create db:schema:load

      # - name: Check schema files are up to date
      #   run: |
      #     bin/rails db:migrate
      #     git diff --exit-code -- db/schema.rb db/structure.sql

      - name: Rubocop
        run: bundle exec rubocop

      - name: ESLint
        run: bin/yarn eslint app/javascript --max-warnings=0

      - name: Check translations
        run: |
          bundle exec i18n-tasks check-consistent-interpolations
          bundle exec i18n-tasks check-reserved-interpolations

      - name: Packwerk
        run: |
          bundle exec packwerk validate
          bin/packwerk check

      - name: Run security checks
        run: |
          bundle exec brakeman --no-progress \
            --ignore-config config/brakeman.ignore \
            --ensure-ignore-notes \
            --ensure-no-obsolete-ignore-entries
          bundle exec bundle audit --update

  tests:
    name: ${{ matrix.name }}
    needs: assets
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RENALWARE_EXTENSIONS: heroic
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RSpec unit tests
            command: bin/gh/rspec/unit
            browser: false
            javascript: true
          - name: RSpec integration tests
            command: bin/gh/rspec/integration
            browser: true
            javascript: true
          - name: Cucumber domain tests
            command: bin/gh/cucumber/domain
            browser: false
            javascript: false
          - name: Cucumber web tests
            command: bin/gh/cucumber/web
            browser: true
            javascript: true

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup node and yarn with caching
        if: matrix.javascript
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"

      - name: Install js packages with yarn
        if: matrix.javascript
        run: yarn install --frozen-lockfile # optional, --immutable

      - name: Cache Playwright Chromium browser
        if: matrix.browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium browser (with deps)
        if: matrix.browser && steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn run playwright install --with-deps chromium

      - name: Install Playwright Chromium browser deps
        if: matrix.browser && steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn run playwright install-deps chromium

      - name: Restore asset cache
        if: matrix.browser
        uses: actions/cache@v6
        with:
          path: |
            public/assets
            tmp/cache/assets/sprockets
          key: asset-cache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}

      - name: Install system dependencies
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update

          client_version="$(
            apt-cache madison postgresql-client-18 |
              awk '$3 ~ /^18[.]4-/ { print $3; exit }'
          )"
          test -n "$client_version"
          sudo apt-get install -y \
            "postgresql-client-18=$client_version" \
            ghostscript \
            pandoc
          pg_dump --version | grep -F "18.4"

      - name: Setup test database
        env:
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          RAILS_ENV: test
          PGHOST: localhost
        run: bin/rails db:create db:schema:load db:migrate

      - name: Run tests
        env:
          PGHOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          RAILS_ENV: test
        run: ${{ matrix.command }}

      - name: Store test failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-screenshots
          path: tmp/capybara
          if-no-files-found: ignore
